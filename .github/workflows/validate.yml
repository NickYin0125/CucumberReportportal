name: Shared Validation

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      artifact-id:
        description: Immutable artifact from this successful validation job
        value: ${{ jobs.bundle.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  test:
    name: test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    env:
      CUCUMBER_PUBLISH_QUIET: "true"
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Record the locked source runtime
        run: |
          ruby --version
          bundle exec ruby -e 'require "reportportal_cucumber"; cucumber = Gem.loaded_specs.fetch("cucumber").version; puts "SDK=#{ReportportalCucumber::VERSION} Cucumber=#{cucumber}"; if ReportportalCucumber::VERSION.start_with?("2."); abort "Unsupported target Cucumber" unless Gem::Requirement.new("~> 12.0", ">= 12.0.1").satisfied_by?(cucumber); end'

      - uses: azure/setup-helm@v5
        with:
          version: "v3.18.4"

      - name: Select portable Helm executable
        run: |
          helm_bin="$(command -v helm)"
          test -x "$helm_bin"
          echo "HELM_BIN=$helm_bin" >> "$GITHUB_ENV"

      - name: Build locked Helm dependency on a fresh runner
        run: |
          sha256sum helm/reportportal-rich-experience/Chart.lock > "$RUNNER_TEMP/chart-lock.sha256"
          helm repo add reportportal https://k8s.reportportal.io/
          helm repo update
          helm dependency build ./helm/reportportal-rich-experience
          sha256sum --check "$RUNNER_TEMP/chart-lock.sha256"

      - name: Validate Helm deployment profiles without deploying
        run: |
          chart=./helm/reportportal-rich-experience
          helm lint "$chart" --kube-version 1.35.0
          helm template release-validation "$chart" --kube-version 1.35.0 > /dev/null
          for profile in values-local-latest.yaml values-production.example.yaml; do
            helm lint "$chart" --kube-version 1.35.0 -f "$chart/$profile"
            helm template release-validation "$chart" --kube-version 1.35.0 -f "$chart/$profile" > /dev/null
          done
          helm lint "$chart" --kube-version 1.35.0 -f "$chart/values-production.example.yaml" -f "$chart/values-huawei.example.yaml"
          helm template release-validation "$chart" --kube-version 1.35.0 -f "$chart/values-production.example.yaml" -f "$chart/values-huawei.example.yaml" > /dev/null

      - name: Prepare synthetic RSpec fault diagnostics
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/rspec-fault-diagnostics/day2" "$RUNNER_TEMP/rspec-fault-diagnostics/m4d"

      - name: Run full RSpec including installed packaging checks
        env:
          DAY2_LOCAL_CAPTURE: ${{ runner.temp }}/rspec-fault-diagnostics/day2
          M4_D_EVIDENCE_DIR: ${{ runner.temp }}/rspec-fault-diagnostics/m4d
        run: bundle exec rspec

      - name: Retain synthetic RSpec fault diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rspec-faults-ruby-${{ matrix.ruby }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rspec-fault-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Run full offline Cucumber profile
        run: bundle exec cucumber

      - name: Run release dependency isolation regressions
        run: bundle exec rspec script/release/spec

  legacy:
    name: legacy (Ruby ${{ matrix.ruby }}, Cucumber ${{ matrix.cucumber }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.3"]
        cucumber: ["9", "10"]
    env:
      CUCUMBER_PUBLISH_QUIET: "true"
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      BUNDLE_FROZEN: "false"
      CUCUMBER_REQUIREMENT: ~> ${{ matrix.cucumber }}.0
      CUCUMBER_MAJOR: ${{ matrix.cucumber }}
      LEGACY_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      # maintenance/1.x remains frozen at this immutable released commit.
      # Never install Cucumber 9/10 against the SDK 2.x checkout/gemspec.
      - uses: actions/checkout@v6
        with:
          ref: 4ca2f770e0a84e83688f165ba04b4db8ef855cf9
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable released maintenance baseline
        run: |
          test "$(git rev-parse HEAD)" = 4ca2f770e0a84e83688f165ba04b4db8ef855cf9
          test "$(git rev-parse --verify 'refs/tags/v1.3.1^{commit}')" = 4ca2f770e0a84e83688f165ba04b4db8ef855cf9

      # These drivers SHA-verify the original specs and retain every case,
      # normalizing only version provenance and platform-dependent fixture inputs.
      - name: Check out the reviewed immutable legacy test drivers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci-driver
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            spec/fixtures/legacy_fault_process.rb
            spec/fixtures/legacy_portability.rb
            spec/fixtures/legacy_portability_specs.rb
          sparse-checkout-cone-mode: false

      - name: Record immutable legacy production hashes before execution
        run: git ls-files -z lib reportportal-cucumber-ruby.gemspec | xargs -0 sha256sum > .ci-driver/legacy-production.sha256

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.6.6"

      - name: Resolve this legacy runtime without changing its gemspec
        run: |
          ruby -rfileutils -e 'File.open("Gemfile", "a") { |file| file.puts "\ngem \"cucumber\", #{ENV.fetch("CUCUMBER_REQUIREMENT").inspect}" }; FileUtils.rm_f("Gemfile.lock")'
          bundle install --jobs 4
          bundle exec ruby -e 'require "reportportal_cucumber"; cucumber = Gem.loaded_specs.fetch("cucumber").version; abort "Wrong SDK source" unless ReportportalCucumber::VERSION == "1.3.1"; abort "Wrong Cucumber major" unless cucumber.segments.first.to_s == ENV.fetch("CUCUMBER_MAJOR"); puts "SDK=#{ReportportalCucumber::VERSION} Cucumber=#{cucumber} Ruby=#{RUBY_VERSION}"'

      - uses: azure/setup-helm@v5
        with:
          version: "v3.18.4"

      - name: Build the baseline locked Helm dependency without deployment
        run: |
          helm_bin="$(command -v helm)"
          test -x "$helm_bin"
          echo "HELM_BIN=$helm_bin" >> "$GITHUB_ENV"
          sha256sum helm/reportportal-rich-experience/Chart.lock > "$RUNNER_TEMP/chart-lock.sha256"
          helm repo add reportportal https://k8s.reportportal.io/
          helm repo update
          helm dependency build ./helm/reportportal-rich-experience
          sha256sum --check "$RUNNER_TEMP/chart-lock.sha256"

      # Keep the immutable driver's exact step env and arguments unchanged.
      - name: Prepare synthetic RSpec fault diagnostics
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/legacy-rspec-fault-diagnostics/day2" "$RUNNER_TEMP/legacy-rspec-fault-diagnostics/m4d"
          echo "DAY2_LOCAL_CAPTURE=$RUNNER_TEMP/legacy-rspec-fault-diagnostics/day2" >> "$GITHUB_ENV"
          echo "M4_D_EVIDENCE_DIR=$RUNNER_TEMP/legacy-rspec-fault-diagnostics/m4d" >> "$GITHUB_ENV"

      - name: Run the legacy RSpec suite with explicit test-only fixture normalization
        env:
          M4A_CHILD_EVIDENCE_DIR: ${{ runner.temp }}/legacy-m4a
        run: |
          legacy_args=(
            spec
            .ci-driver/spec/fixtures/legacy_fault_process.rb
            .ci-driver/spec/fixtures/legacy_portability_specs.rb
            --exclude-pattern 'spec/{day2/fault_process_spec.rb,reportportal_cucumber/cucumber/world_spec.rb,reportportal_cucumber/cucumber/m4a_public_delivery_integration_spec.rb}'
          )
          bundle exec rspec "${legacy_args[@]}" --dry-run --format json --out "$RUNNER_TEMP/legacy-discovery.json"
          bundle exec ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            summary = report.fetch("summary")
            examples = report.fetch("examples")
            ids = examples.map { |example| example.fetch("id") }
            valid = summary.fetch("example_count") == 889 && examples.length == 889 &&
              ids.all? { |id| id.is_a?(String) && !id.empty? } && ids.uniq.length == 889 &&
              summary.fetch("failure_count").zero? && summary.fetch("pending_count").zero? &&
              summary.fetch("errors_outside_of_examples_count").zero?
            abort "Immutable legacy discovery must contain exactly 889 unique examples without errors" unless valid
            puts "Immutable legacy discovery verified: 889 examples, 889 unique IDs"
          ' "$RUNNER_TEMP/legacy-discovery.json"
          bundle exec rspec "${legacy_args[@]}"

      - name: Run the full released baseline offline Cucumber profile
        run: bundle exec cucumber

      - name: Require unchanged baseline production source
        if: always()
        run: |
          git diff --exit-code -- . ':!Gemfile' ':!Gemfile.lock'
          sha256sum --check .ci-driver/legacy-production.sha256
          sha256sum \
            spec/day2/fault_process_spec.rb \
            spec/reportportal_cucumber/cucumber/world_spec.rb \
            spec/reportportal_cucumber/cucumber/m4a_public_delivery_integration_spec.rb \
            .ci-driver/spec/fixtures/legacy_fault_process.rb \
            .ci-driver/spec/fixtures/legacy_portability.rb \
            .ci-driver/spec/fixtures/legacy_portability_specs.rb

      - name: Retain the exact legacy dependency resolution
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: legacy-lock-ruby-${{ matrix.ruby }}-cucumber-${{ matrix.cucumber }}-${{ github.run_attempt }}
          path: |
            Gemfile.lock
            spec/day2/fault_process_spec.rb
            spec/reportportal_cucumber/cucumber/world_spec.rb
            spec/reportportal_cucumber/cucumber/m4a_public_delivery_integration_spec.rb
            .ci-driver/spec/fixtures/legacy_fault_process.rb
            .ci-driver/spec/fixtures/legacy_portability.rb
            .ci-driver/spec/fixtures/legacy_portability_specs.rb
            .ci-driver/legacy-production.sha256
            ${{ runner.temp }}/legacy-discovery.json
            ${{ runner.temp }}/legacy-m4a/public-delivery-child.json
            ${{ runner.temp }}/legacy-m4a/attempt-admissions.ndjson
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Retain synthetic RSpec fault diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: legacy-rspec-faults-ruby-${{ matrix.ruby }}-cucumber-${{ matrix.cucumber }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-rspec-fault-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  gate:
    needs: [test, legacy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every current and legacy matrix cell
        env:
          CURRENT_RESULT: ${{ needs.test.result }}
          LEGACY_RESULT: ${{ needs.legacy.result }}
        run: |
          test "$CURRENT_RESULT" = success
          test "$LEGACY_RESULT" = success

  bundle:
    needs: gate
    if: inputs.release && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      BUNDLE_FROZEN: "true"
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate release dependencies before Ruby setup
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/release-gems" >> "$GITHUB_ENV"
          echo "BUNDLE_APP_CONFIG=$RUNNER_TEMP/release-bundle-config" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # Cache mode forces vendor/bundle inside the clean release checkout.
          bundler-cache: false

      - name: Install locked release dependencies outside source
        run: bundle install --jobs 4

      - uses: azure/setup-helm@v5
        with:
          version: "v3.18.4"

      - name: Prepare the locked chart for packaging without deployment
        run: |
          helm_bin="$(command -v helm)"
          test -x "$helm_bin"
          echo "HELM_BIN=$helm_bin" >> "$GITHUB_ENV"
          sha256sum helm/reportportal-rich-experience/Chart.lock > "$RUNNER_TEMP/chart-lock.sha256"
          helm repo add reportportal https://k8s.reportportal.io/
          helm repo update
          helm dependency build ./helm/reportportal-rich-experience
          sha256sum --check "$RUNNER_TEMP/chart-lock.sha256"

      - name: Build verified release bundle
        run: bundle exec ruby script/release/cli.rb build "$RELEASE_TAG" "$RELEASE_SHA" "$RUNNER_TEMP/release-bundle"

      - name: Preserve validated release bundle
        id: artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          if-no-files-found: error
          retention-days: 7
