name: Shared Validation

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      artifact-id:
        description: Immutable artifact from this successful validation job
        value: ${{ jobs.bundle.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  test:
    name: matrix (Ruby ${{ matrix.ruby }}, Cucumber ${{ matrix.cucumber }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.3"]
        cucumber: ["9.2.1", "10.2.0"]
    env:
      CUCUMBER_PUBLISH_QUIET: "true"
      BUNDLE_FROZEN: "false"
      CUCUMBER_VERSION: ${{ matrix.cucumber }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate matrix dependencies before Ruby setup
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          echo "BUNDLE_GEMFILE=$RUNNER_TEMP/runtime/Gemfile" >> "$GITHUB_ENV"
          echo "BUNDLE_PATH=$RUNNER_TEMP/runtime-gems" >> "$GITHUB_ENV"
          echo "BUNDLE_APP_CONFIG=$RUNNER_TEMP/runtime-bundle-config" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.6.6"
          bundler-cache: false

      - name: Resolve the exact matrix runtime without changing source
        run: |
          ruby -e 'File.write(ENV.fetch("BUNDLE_GEMFILE"), "eval_gemfile #{File.join(ENV.fetch("GITHUB_WORKSPACE"), "Gemfile").inspect}\ngem \"cucumber\", #{("= " + ENV.fetch("CUCUMBER_VERSION")).inspect}\ngem \"diff-lcs\", \"< 2\"\n")'
          bundle install --jobs 4
          echo "BUNDLE_FROZEN=true" >> "$GITHUB_ENV"

      - name: Record the exact matrix runtime
        run: |
          ruby --version
          bundle exec ruby -rjson -e 'require "reportportal_cucumber"; cucumber = Gem.loaded_specs.fetch("cucumber").version.to_s; diff_lcs = Gem.loaded_specs.fetch("diff-lcs").version; abort "Wrong SDK source" unless ReportportalCucumber::VERSION == "1.3.3"; abort "Wrong Cucumber version" unless cucumber == ENV.fetch("CUCUMBER_VERSION"); abort "Wrong test diff-lcs version" unless Gem::Requirement.new("< 2").satisfied_by?(diff_lcs); puts JSON.pretty_generate(sdk: ReportportalCucumber::VERSION, cucumber: cucumber, diff_lcs: diff_lcs.to_s, ruby: RUBY_DESCRIPTION, bundler: Bundler::VERSION)' > "$RUNNER_TEMP/runtime/runtime.json"
          cat "$RUNNER_TEMP/runtime/runtime.json"
          sha256sum Gemfile Gemfile.lock reportportal-cucumber-ruby.gemspec > "$RUNNER_TEMP/runtime/source-dependencies.sha256"

      - uses: azure/setup-helm@v5
        with:
          version: "v3.18.4"

      - name: Select portable Helm executable
        run: |
          helm_bin="$(command -v helm)"
          test -x "$helm_bin"
          echo "HELM_BIN=$helm_bin" >> "$GITHUB_ENV"

      - name: Build locked Helm dependency on a fresh runner
        run: |
          sha256sum helm/reportportal-rich-experience/Chart.lock > "$RUNNER_TEMP/chart-lock.sha256"
          helm repo add reportportal https://k8s.reportportal.io/
          helm repo update
          helm dependency build ./helm/reportportal-rich-experience
          sha256sum --check "$RUNNER_TEMP/chart-lock.sha256"

      - name: Validate Helm deployment profiles without deploying
        run: |
          chart=./helm/reportportal-rich-experience
          helm lint "$chart" --kube-version 1.35.0
          helm template release-validation "$chart" --kube-version 1.35.0 > /dev/null
          for profile in values-local-latest.yaml values-production.example.yaml; do
            helm lint "$chart" --kube-version 1.35.0 -f "$chart/$profile"
            helm template release-validation "$chart" --kube-version 1.35.0 -f "$chart/$profile" > /dev/null
          done
          helm lint "$chart" --kube-version 1.35.0 -f "$chart/values-production.example.yaml" -f "$chart/values-huawei.example.yaml"
          helm template release-validation "$chart" --kube-version 1.35.0 -f "$chart/values-production.example.yaml" -f "$chart/values-huawei.example.yaml" > /dev/null

      - name: Prepare synthetic RSpec fault diagnostics
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/rspec-fault-diagnostics/day2" "$RUNNER_TEMP/rspec-fault-diagnostics/m4d"

      - name: Run full RSpec including installed packaging checks
        env:
          DAY2_LOCAL_CAPTURE: ${{ runner.temp }}/rspec-fault-diagnostics/day2
          M4_D_EVIDENCE_DIR: ${{ runner.temp }}/rspec-fault-diagnostics/m4d
        run: bundle exec rspec

      - name: Retain synthetic RSpec fault diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rspec-faults-ruby-${{ matrix.ruby }}-cucumber-${{ matrix.cucumber }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rspec-fault-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Run full offline Cucumber profile
        run: bundle exec cucumber

      - name: Run release dependency isolation regressions
        run: bundle exec rspec script/release/spec

      - name: Require unchanged tracked source
        if: always()
        run: |
          git diff --exit-code
          sha256sum --check "$RUNNER_TEMP/runtime/source-dependencies.sha256"

      - name: Retain the exact matrix dependency resolution
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-lock-ruby-${{ matrix.ruby }}-cucumber-${{ matrix.cucumber }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  gate:
    # Recovery verifies this exact historical check name after all four cells.
    name: test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every maintenance matrix cell
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = success

  bundle:
    needs: gate
    if: inputs.release && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      BUNDLE_FROZEN: "true"
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate release dependencies before Ruby setup
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/release-gems" >> "$GITHUB_ENV"
          echo "BUNDLE_APP_CONFIG=$RUNNER_TEMP/release-bundle-config" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # Cache mode forces vendor/bundle inside the clean release checkout.
          bundler-cache: false

      - name: Install locked release dependencies outside source
        run: bundle install --jobs 4

      - uses: azure/setup-helm@v5
        with:
          version: "v3.18.4"

      - name: Prepare the locked chart for packaging without deployment
        run: |
          helm_bin="$(command -v helm)"
          test -x "$helm_bin"
          echo "HELM_BIN=$helm_bin" >> "$GITHUB_ENV"
          sha256sum helm/reportportal-rich-experience/Chart.lock > "$RUNNER_TEMP/chart-lock.sha256"
          helm repo add reportportal https://k8s.reportportal.io/
          helm repo update
          helm dependency build ./helm/reportportal-rich-experience
          sha256sum --check "$RUNNER_TEMP/chart-lock.sha256"

      - name: Build verified release bundle
        if: inputs.release && github.event_name == 'push' && github.ref_type == 'tag'
        run: bundle exec ruby script/release/cli.rb build "$RELEASE_TAG" "$RELEASE_SHA" "$RUNNER_TEMP/release-bundle"

      - name: Preserve validated release bundle
        id: artifacts
        if: inputs.release && github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          if-no-files-found: error
          retention-days: 7
