{{- if and .Values.videoBucket.enabled (not .Values.videoBucket.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reportportal-rich-experience.videoBucketSecretName" . }}
  labels:
    {{- include "reportportal-rich-experience.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.videoBucket.auth.accessKeyKey }}: {{ required "videoBucket auth access key is required" (include "reportportal-rich-experience.videoBucketAccessKey" .) | quote }}
  {{ .Values.videoBucket.auth.secretKeyKey }}: {{ required "videoBucket auth secret key is required" (include "reportportal-rich-experience.videoBucketSecretKey" .) | quote }}
{{- end }}
