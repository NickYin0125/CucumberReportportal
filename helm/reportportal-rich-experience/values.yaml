# Values under `reportportal` are passed directly to the official ReportPortal chart.
reportportal:
  ingress:
    enable: true
    class: traefik
    hosts: null
    path: ""
    annotations: {}
  storage:
    type: minio
    accesskey: rpuser
    secretkey: miniopassword
    ssl: false
    port: ""
    bucket:
      type: multi
  minio:
    install: true
    # Fresh-install capacity; do not change an existing PVC without a storage plan.
    persistence:
      size: 8Gi
    auth:
      rootUser: rpuser
      rootPassword: miniopassword
    console:
      enabled: false
  uat:
    superadminInitPasswd:
      password: erebus
  rabbitmq:
    config:
      # CloudPirates otherwise grants the bootstrap user access to '/' only.
      # For a custom msgbroker.vhost, change default_vhost here as well.
      extraConfiguration: |
        deprecated_features.permit.queue_master_locator = true
        default_vhost = analyzer

# Extra resources for this Ruby client project's MinIO-backed MP4 playback mode.
videoBucket:
  enabled: true
  name: automation-videos
  objectPrefix: videos
  makePublic: true
  # A disabled extension still reconciles an existing bucket to private access.
  revokeOnDisable: true
  retention:
    enabled: true
    expireDays: 30
  quota:
    enabled: true
    # At most half of the default 8Gi volume; RP attachments share this storage.
    size: 4GiB
  endpoint:
    scheme: http
    host: ""
    port: 9000
  auth:
    existingSecret: ""
    accessKeyKey: access-key
    secretKeyKey: secret-key
    accessKey: ""
    secretKey: ""
  ingress:
    enabled: true
    className: traefik
    hosts: []
    path: /automation-videos
    pathType: Prefix
    serviceName: ""
    servicePort: 9000
    annotations: {}
    tls: []
  job:
    useHelmHooks: true
    hookWeight: 20
    backoffLimit: 6
    ttlSecondsAfterFinished: 300
    activeDeadlineSeconds: 600
    image:
      repository: minio/mc
      tag: RELEASE.2025-07-21T05-28-08Z
      pullPolicy: IfNotPresent
    wait:
      attempts: 60
      sleepSeconds: 5
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
